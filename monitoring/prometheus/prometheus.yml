rule_files:
  - /etc/prometheus/alerts/*.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: timescaledb
    static_configs:
      - targets:
          - timescale-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
  - job_name: kafka
    static_configs:
      - targets:
          - kafka:9404

  - job_name: kafka-connect
    static_configs:
      - targets:
          - kafka-connect:9405

  - job_name: mosquitto
    static_configs:
      - targets:
          - mosquitto-exporter:9234

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    bearer_token_file: /etc/prometheus/minio-token
    static_configs:
      - targets:
          - minio:9000
